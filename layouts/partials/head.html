<head>
    <link href="http://gmpg.org/xfn/11" rel="profile" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <!-- Enable responsiveness on mobile devices-->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>
        {{- if .IsHome -}} {{- .Site.Params.Title }} - {{
        .Site.Params.Tagline -}} {{ else }} {{- .Title }} - {{
        .Site.Params.Title }} - {{ .Site.Params.Tagline -}} {{- end -}}
    </title>

    <!--Metadata-->
    {{ with .Site.Params.Author }}
    <meta name="author" content="{{ . }}" />
    {{ end }} {{ with .Site.Title }}
    <meta property="og:site_name" content="{{ . }}" />
    {{ end }} {{ if not .IsPage }}
    <meta property="og:description" content="{{ .Site.Params.Description }}" />
    <meta
        property="twitter:description"
        content="{{ .Site.Params.Description }}"
    />
    <meta
        property="og:title"
        content="{{ .Site.Params.Title }} - {{ .Site.Params.Tagline }}"
    />
    <meta
        property="twitter:title"
        content="{{ .Site.Params.Title }} - {{ .Site.Params.Tagline }}"
    />
    <meta property="og:type" content="website" />
    {{ else }}
    <meta
        property="og:description"
        content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}"
    />
    <meta
        property="twitter:description"
        content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}"
    />
    <meta
        property="og:title"
        content="{{ .Title }} - {{ .Site.Params.Title }} - {{ .Site.Params.Tagline }}"
    />
    <meta
        property="twitter:title"
        content="{{ .Title }} - {{ .Site.Params.Title }} - {{ .Site.Params.Tagline }}"
    />
    <meta property="og:type" content="article" />
    {{ end }}
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="twitter:url" content="{{ .Permalink }}" />
    <meta property="twitter:card" content="summary" />
    <meta
        name="keywords"
        content="Notes, Software, Programming, Linux, Networking, Security, DevOps, Web"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="{{ "/css/poole.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "/css/syntax.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "/css/lanyon.css" | relURL }}" />
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=PT+Serif:400,400italic,700|PT+Sans:400"
    />
    <link
        rel="stylesheet"
        href="{{ "/font-awesome/css/font-awesome.min.css" | relURL }}"
    />

    <!--Canonical URL-->
    <link rel="canonical" href="{{ .Permalink }}" />

    <!-- Icons -->
    <link
        rel="apple-touch-icon-precomposed"
        sizes="144x144"
        href="{{ "/assets/apple-touch-icon-144-precomposed.png" | relURL }}"
    />
    <link rel="shortcut icon" href="{{ "/assets/favicon.ico" | relURL }}" />
</head>
